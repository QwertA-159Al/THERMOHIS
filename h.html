<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THERMOHIS Üretim Takip</title>
<style>
:root{--bg:#08111f;--panel:#111c2e;--border:#22334d;--text:#e5edf7;--muted:#8fa3bb;--blue:#55a7ff;--green:#35d399;--red:#fb7185;--yellow:#f6c453}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#123254 0,var(--bg) 42%);color:var(--text);font-family:"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:28px clamp(18px,5vw,64px) 20px;border-bottom:1px solid var(--border)}
h1{margin:0;color:var(--blue);font-size:clamp(24px,4vw,40px)}p{margin:7px 0}.muted,.updated{color:var(--muted)}.updated{white-space:nowrap;font-size:13px}
main{padding:24px clamp(18px,5vw,64px) 48px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}.summary-item{background:var(--panel);border:1px solid var(--border);padding:12px 16px;border-radius:9px}.summary-label{color:var(--muted);font-size:13px;margin-right:8px}.summary-value{font-weight:700}
.notice{padding:14px;background:#18263b;border:1px solid var(--border);border-radius:9px;color:var(--muted);margin-bottom:20px}.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{background:rgba(17,28,46,.94);border:1px solid var(--border);border-radius:10px;padding:18px;min-height:174px}.card h2{margin:0 0 16px;font-size:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #8fa3bb22}.label{color:var(--muted)}.count{color:var(--yellow);font-size:28px;font-weight:800}.running{color:var(--green);font-weight:700}.stopped{color:var(--red);font-weight:700}
@media(max-width:600px){header{display:block}.updated{margin-top:14px}}
</style>
</head>
<body>
<header><div><h1>THERMOHIS</h1><p class="muted">Canlı üretim takip paneli</p></div><p class="updated" id="updated">Veriler bekleniyor...</p></header>
<main>
<div class="notice" id="notice">Google Sheet verileri yükleniyor...</div>
<section class="summary"><div class="summary-item"><span class="summary-label">Makine</span><span class="summary-value" id="machine-total">0</span></div><div class="summary-item"><span class="summary-label">Çalışan</span><span class="summary-value" id="running-total">0</span></div><div class="summary-item"><span class="summary-label">Toplam üretim</span><span class="summary-value" id="production-total">0</span></div></section>
<section class="machines" id="machines"></section>
</main>
<script>
const SHEET_JSON='https://docs.google.com/spreadsheets/d/1RYdGaL3zG_2zZmNzVqeLwKYkvXfRQD18WEYyxpp054M/gviz/tq?tqx=out:json&gid=0';
const machineConfig=[
 ['Boru Çekme',[502,502,502,502,502,502,502,502],500,501],['İç Su Press\'i',[506,506],504,505],['İç İkiye Bölme',[510,510],508,509],['İç Kafa Kesme',[514],512,513],['İç Trim',[522,524],520,521],['İç Ağız Büküm',[528,530],526,527],['İç Alt Form Düz.',[534],532,533],['İç CNC',[542,544],540,541],['Dış Su Press\'i',[548,548],546,547],['Dış İkiye Bölme',[552,552],550,551],['Dış Kafa Kesme',[560],558,559],['Dış Üst Form Düz.',[564],562,563],['Dış Yatay Trim',[568],566,567],['Dış Diş Açma',[572],570,571],['Lazer Kaynak',[575,576],573,574],['İç Kılıf Taban Kaynak',[579],577,578],['Dış Kılıf Taban Kaynak',[582,583],580,581],['Puntalama Makinesi',[586],584,585],['Su Testi',[589],587,588]
];
const formatNumber=value=>Number(value).toLocaleString('tr-TR');
function formatDuration(seconds){
 const totalSeconds=Math.max(0,Math.floor(Number(seconds)||0));
 const hours=Math.floor(totalSeconds/3600);
 const minutes=Math.floor(totalSeconds%3600/60);
 const remainingSeconds=totalSeconds%60;
 return [hours,minutes,remainingSeconds].map(value=>String(value).padStart(2,'0')).join(':');
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));}
function loadSheetRow(){
 return new Promise((resolve,reject)=>{
  window.google=window.google||{};window.google.visualization=window.google.visualization||{};window.google.visualization.Query=window.google.visualization.Query||{};
  let script=null;
  const timeout=setTimeout(()=>{cleanup();reject(Error('Google Sheet zaman aşımı'));},10000);
  function cleanup(){clearTimeout(timeout);delete window.google.visualization.Query.setResponse;if(script)script.remove();}
  window.google.visualization.Query.setResponse=data=>{if(data.status!=='ok'||!data.table?.rows?.[0]){cleanup();reject(Error('Google Sheet verisi boş'));return}const cells=data.table.rows[0].c.map(cell=>cell?.v??'');cleanup();resolve(cells);};
  script=document.createElement('script');script.src=SHEET_JSON+'&t='+Date.now();script.onerror=()=>{cleanup();reject(Error('Google Sheet bağlantısı kurulamadı'));};document.head.appendChild(script);
 });
}
function render(machines){
 document.getElementById('machines').innerHTML=machines.map(machine=>{const running=Number(machine.adet)>0;return `<article class="card"><h2>${escapeHtml(machine.isim)}</h2><div class="row"><span class="label">Durum</span><span class="${running?'running':'stopped'}">${running?'Çalışıyor':'Duruyor'}</span></div><div class="row"><span class="label">Üretim adedi</span><span class="count">${formatNumber(machine.adet)}</span></div><div class="row"><span class="label">Çalışma Zamanı</span><span>${formatDuration(machine.calisma)}</span></div><div class="row"><span class="label">Durma Zamanı</span><span>${formatDuration(machine.durma)}</span></div></article>`}).join('');
 document.getElementById('machine-total').textContent=machines.length;
 document.getElementById('running-total').textContent=machines.filter(machine=>Number(machine.adet)>0).length;
 document.getElementById('production-total').textContent=formatNumber(machines.reduce((total,machine)=>total+Number(machine.adet||0),0));
 document.getElementById('updated').textContent='Son güncelleme: '+new Date().toLocaleTimeString('tr-TR');
 document.getElementById('notice').textContent='Google Sheet D verileri doğrudan okunuyor.';
}
async function update(){
 try{
    const cells=await loadSheetRow();
  const registers={};for(let index=0;index<=100;index++){const raw=String(cells[index]??'').trim().replace(',','.');registers[500+index]=raw===''?0:Number(raw)||0;}
  render(machineConfig.map((machine,id)=>({id,isim:machine[0],adet:machine[1].reduce((total,register)=>total+registers[register],0),calisma:registers[machine[2]],durma:registers[machine[3]]})));
 }catch(error){document.getElementById('notice').textContent='Google Sheet okunamadı. Sheet paylaşımını "Bağlantıya sahip herkes: Görüntüleyici" yapın.';}
}
update();setInterval(update,3000);
</script>
</body>
</html>
